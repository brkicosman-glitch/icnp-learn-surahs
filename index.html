<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICNP • Learn the Surahs by Heart</title>
<style>
:root{--bg:#f5f7f9;--card:#fff;--text:#17202a;--muted:#64748b;--line:#dbe2e8;--accent:#16735b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:22px 16px;text-align:center}
h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:900px;margin:auto;padding:18px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
select,button{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:10px 12px;font-size:16px}
button{cursor:pointer;font-weight:600}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:34px;line-height:2.1;text-align:right;direction:rtl}
.trans{font-size:17px;line-height:1.65}.meaning{color:var(--muted);line-height:1.6}
.badge{display:inline-block;background:#eef7f3;color:var(--accent);padding:5px 9px;border-radius:999px;font-size:13px}
h2{margin:4px 0 12px}.ayah{border-top:1px solid var(--line);padding:16px 0}.ayah:first-child{border-top:0}
.small{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
</style>
</head>
<body>
<header>
<h1>Islamic Center of North Phoenix</h1>
<p>ICNP Mekteb • Learn the Surahs by Heart</p>
</header>
<main>
<div class="card">
<span class="badge">Choose a Surah</span>
<select id="surah"></select>
</div>

<div class="card">
<div class="grid">
<button class="primary" onclick="follow()">Follow</button>
<button onclick="buildAyah()">Build the Ayah</button>
<button onclick="smartReview()">Smart Review</button>
</div>
</div>

<div class="card">
<div class="row">
<button class="primary" onclick="start()">Start</button>
<button onclick="restart()">Restart</button>
</div>
</div>

<div class="card">
<h2 id="title">Select a surah</h2>
<div id="content"><p class="meaning">Choose a surah above to begin.</p></div>
</div>
</main>

<script>
const surahs = [
["fatiha","El-Fatiha","1"],["duha","Ed-Duha","93"],["sharh","Eš-Šerh","94"],["tin","Et-Tin","95"],
["alaq","El-Alek","96"],["qadr","El-Kadr","97"],["bayyina","El-Bejjine","98"],["zalzala","Ez-Zilzal","99"],
["adiyat","El-Adijat","100"],["qariah","El-Kariah","101"],["takathur","Et-Tekasur","102"],["asr","El-Asr","103"],
["humaza","El-Humeze","104"],["fil","El-Fil","105"],["quraysh","Kurejš","106"],["maun","El-Ma'un","107"],
["kawthar","El-Kevser","108"],["kafirun","El-Kafirun","109"],["nasr","En-Nasr","110"],["masad","El-Mesed","111"],
["ikhlas","El-Ihlas","112"],["falaq","El-Felek","113"],["nas","En-Nas","114"],
["kursi","Ajetul-Kursijj","2:255"],["alim","Elif-Lam-Mim","2:1-5"],["kunut","Kunut-dova","Special"]
];

const samples = {
fatiha:[
"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ",
"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
],
kursi:["اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ"],
alim:["الم","ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ"],
kunut:["اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ","وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ"]
};

const sel=document.getElementById("surah");
surahs.forEach(s=>{let o=document.createElement("option");o.value=s[0];o.textContent=s[1]+" — "+s[2];sel.appendChild(o)});
sel.value="fatiha"; render();

sel.addEventListener("change",render);
function render(){
 const id=sel.value, s=surahs.find(x=>x[0]===id);
 document.getElementById("title").textContent=s[1];
 const verses=samples[id]||["المحتوى جاهز للإضافة — اختر السورة ثم استخدم أدوات المراجعة."];
 document.getElementById("content").innerHTML=verses.map((v,i)=>`<div class="ayah"><div class="arabic">${v} ﴿${i+1}﴾</div><div class="trans">Repeat this ayah slowly and carefully.</div><div class="meaning">ICNP Mekteb • Ayah ${i+1}</div></div>`).join("");
}
function start(){alert("Start: begin memorization for "+document.getElementById("title").textContent)}
function restart(){render()}
function follow(){alert("Follow mode selected. Read and repeat each ayah.")}
function buildAyah(){alert("Build the Ayah mode selected.")}
function smartReview(){alert("Smart Review selected.")}
</script>
</body>
</html>

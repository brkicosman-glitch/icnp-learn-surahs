  <!doctype html>  `    
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4d">
<title>ICNP • Learn the Surahs by Heart</title>

<style>
:root{
--g:#176b4d;--g2:#0e4b36;--gold:#c8a43a;
--bg:#f5f7f4;--card:#fff;--ink:#17352a;
--muted:#68756f;--line:#e0e6e1
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
header{
background:linear-gradient(145deg,var(--g2),var(--g));
color:white;padding:22px 16px 18px;text-align:center
}
.brand{font-weight:800}
.sub{opacity:.85;font-size:.9rem}
main{width:min(1050px,96vw);margin:14px auto 28px}
.panel,.ayah,.game{
background:var(--card);border:1px solid var(--line);
border-radius:16px;box-shadow:0 5px 18px #0000000b
}
.panel{padding:14px}
.row{
display:flex;gap:9px;flex-wrap:wrap;align-items:center
}
.select,input,button{font:inherit}
.select,input{
border:1px solid var(--line);border-radius:11px;
padding:11px 12px;background:white;color:var(--ink)
}
button{
border:0;border-radius:11px;padding:10px 13px;
background:var(--g);color:#fff;font-weight:700;cursor:pointer
}
button.alt{background:#eaf0ec;color:var(--g2)}
button.gold{background:var(--gold);color:#17291f}
.tabs{
display:flex;gap:8px;margin-top:12px;overflow:auto
}
.tab{white-space:nowrap}
.tab.active{background:var(--gold);color:#1e3027}
.ayah{margin-top:12px;padding:18px}
.num{
display:inline-flex;width:32px;height:32px;border-radius:50%;
align-items:center;justify-content:center;
background:#edf2ee;color:var(--g);font-weight:800
}
.arabic{
font-family:"Amiri Quran","Amiri",serif;
font-size:2rem;line-height:2.2;text-align:right;
direction:rtl;margin:13px 0
}
.translit{color:#52635b;font-style:italic}
.english{margin-top:8px;line-height:1.55}
.controls{
display:flex;gap:8px;flex-wrap:wrap;margin-top:12px
}
.progress{
height:8px;background:#e8ede9;border-radius:9px;
overflow:hidden;margin-top:10px
}
.bar{height:100%;width:0;background:var(--g)}
.build{padding:16px}
.wordbox{
display:flex;gap:8px;flex-wrap:wrap;min-height:54px;
padding:10px;border:2px dashed #ccd7cf;
border-radius:12px;direction:rtl
}
.word{
background:#eef4f0;color:var(--g2);
border:1px solid #d9e4dc;padding:9px 11px;
border-radius:10px;cursor:pointer
}
.feedback{font-weight:800;margin-top:10px}
.small{font-size:.83rem;color:var(--muted)}
.review-item{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:10px 0;border-bottom:1px solid var(--line)
}
footer{
text-align:center;color:var(--muted);
font-size:.8rem;padding:0 16px 25px
}
@media(max-width:600px){
.arabic{font-size:1.65rem}
.panel{padding:11px}
}
</style>
</head>

<body>

<header>
<div class="brand">Islamic Center of North Phoenix</div>
<h1>🌟 Learn the Surahs by Heart</h1>
<div class="sub">Quran memorization practice • ICNP Mekteb</div>
</header>

<main>

<section class="panel">

<div class="row">

<select id="surah" class="select"></select>
<select id="ayah" class="select"></select>
<select id="special" class="select"></select>

<button id="start">Start / Restart</button>

</div>

<div class="tabs">

<button class="tab active" data-mode="follow">
Follow
</button>

<button class="tab" data-mode="build">
Build the Ayah
</button>

<button class="tab" data-mode="review">
Smart Review
</button>

</div>

</section>

<section id="app"></section>

</main>

<footer>
Islamic Center of North Phoenix • Your progress is saved on this device.  
</footer>

<script>

const state={
data:null,
surah:1,
ayah:1,
mode:'follow',
speed:1,
repeat:0,
audio:null,
review:JSON.parse(localStorage.getItem('icnp-review')||'{}')
};

const $=id=>document.getElementById(id);
const app=$('app');

async function init(){

const r=await fetch('https://raw.githubusercontent.com/brkicosman-glitch/icnp-learn-surahs/main/data.json');
if(!r.ok) throw new Error('data.json HTTP ' + r.status);

state.data=await r.json();

fillSurahs();

try {
  const sr=await fetch('special.json');
  state.special=await sr.json();
  fillSpecial();
} catch(e) {
  console.log('special.json nije učitan');
}

fillSurahs();
  fillSpecial();
selectSurah();
render();

}

function fillSurahs(){

const allowedIds = Array.from({length: 114}, (_, i) => i + 1);

  document.querySelector("#surah").innerHTML =
    state.data.surahs
      .filter(s => allowedIds.includes(Number(s.id)))
      .map(s => `
        <option value="${s.id}">
          ${s.id}. ${s.name} — ${s.arabicName}
        </option>
      `)
      .join("");

  $('#surah').value = state.surah;
}

function fillSpecial(){

  const el = document.querySelector('#special');
  if (!el) return;

  el.innerHTML = state.special.special.map(x =>
    `<option value="${x.id}">${x.name}</option>`
  ).join('');
}

function selectSurah(){

  const s = getS();

  $('ayah').innerHTML =
    s.ayahs.map(a =>
      `<option value="${a.n}">
        Ayah ${a.n}
      </option>`
    ).join('');

  $('ayah').value = state.ayah;
}

function getS(){
return state.data.surahs[state.surah-1]
}

function getA(){
return getS().ayahs[state.ayah-1]
}

$('surah').onchange=e=>{

state.surah=+e.target.value;
state.ayah=1;

selectSurah();
render();

};

$('ayah').onchange=e=>{

state.ayah=+e.target.value;
render();

};

$('start').onclick=()=>{

state.ayah=1;

selectSurah();
render();

};

document.querySelectorAll('.tab').forEach(b=>

b.onclick=()=>{

document.querySelectorAll('.tab')
.forEach(x=>x.classList.remove('active'));

b.classList.add('active');

state.mode=b.dataset.mode;

render();

});

function audioUrl(a){

return `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${a.g}.mp3`;

}

function play(a){

  if(state.audio){
    state.audio.pause();
    state.audio.currentTime = 0;
    state.audio = null;
  }

  const x = new Audio();
  state.audio = x;

  x.src = audioUrl(a);
  x.preload = 'auto';
  x.playbackRate = state.speed;

  let pauseBtn = document.getElementById('pauseBtn');

  if(!pauseBtn){
    const listenBtn = [...document.querySelectorAll('button')]
      .find(b => b.textContent.includes('Listen'));

    if(listenBtn){
      pauseBtn = document.createElement('button');
      pauseBtn.id = 'pauseBtn';
      pauseBtn.textContent = '⏸ Pause';
      pauseBtn.className = listenBtn.className;

      pauseBtn.onclick = () => {

        if(!state.audio) return;

        if(state.audio.paused){
          state.audio.play();
          pauseBtn.textContent = '⏸ Pause';
        } else {
          state.audio.pause();
          pauseBtn.textContent = '▶ Continue';
        }

      };

      listenBtn.after(pauseBtn);
    }
  }

  x.onended = () => {

    if(pauseBtn){
      pauseBtn.remove();
    }

    

  x.onerror = () => {
    console.error('Audio error:', x.error);
    alert('Audio se ne može učitati.');
  };

  x.play()
    .then(() => {
      console.log('Audio started:', x.src);
    })
    .catch(err => {
      console.error('Audio play error:', err);
      alert('Pritisni Listen još jednom.');
    });

}
function mark(){

const k=`${state.surah}:${state.ayah}`;

state.review[k]=(state.review[k]||0)+1;

localStorage.setItem(
'icnp-review',
JSON.stringify(state.review)
);

}

function render(){

if(state.mode==='follow')
renderFollow();

else if(state.mode==='build')
renderBuild();

else
renderReview();

}

function renderFollow(){

const s=getS();
const a=getA();

mark();

app.innerHTML=`

<div class="ayah">

<div class="row">

<span class="num">${a.n}</span>

<b>${s.name} • ${s.arabicName}</b>

<span class="small">
${a.n}/${s.ayahs.length}
</span>

</div>

<div class="arabic">${a.a}</div>

<div class="translit">${a.t}</div>

<div class="english">${a.e}</div>

<div class="controls">

<button id="listen">▶ Listen</button>
<button class="alt" id="pause">⏸ Pause</button>

<button class="alt" id="repeat">
🔁 Repeat 3×
</button>

<button class="alt" id="whole">
▶ Whole Surah
</button>

<button class="alt" id="prev">
← Previous
</button>

<button class="alt" id="next">
Next →
</button>

</div>

<div class="controls">

<button class="alt" data-speed="1">
Normal
</button>

<button class="alt" data-speed=".75">
Slower
</button>

<button class="alt" data-speed=".5">
Slowest
</button>

</div>

<div class="progress">

<div class="bar"
style="width:${Math.round(a.n/s.ayahs.length*100)}%">
</div>

</div>

</div>
`;

$('listen').onclick=()=>{
  state.repeat=0;
  play(a);
};

$('pause').onclick=()=>{
  if(state.audio){
    state.audio.pause();
    console.log('Audio paused');
  }
};

$('repeat').onclick=()=>{
  state.repeat=2;
  play(a);
};

$('whole').onclick=()=>playWhole();

  $('prev').onclick=()=>{
    if(state.ayah > 1){
        state.ayah--;
        selectSurah();
        render();
        play(getS().ayahs[state.ayah-1]);
    }
};



$('next').onclick=()=>{
    if(state.ayah < getS().ayahs.length){
        state.ayah++;
        selectSurah();
        render();
        play(getS().ayahs[state.ayah-1]);
    }
};
document.querySelectorAll('[data-speed]')
.forEach(b=>

b.onclick=()=>{

state.speed=+b.dataset.speed;

if(state.audio)
state.audio.playbackRate=state.speed;

});

}

async function playWhole(){

  if(state.audio){
    state.audio.pause();
    state.audio.currentTime = 0;
    state.audio = null;
  }

  for(
    let i = state.ayah;
    i <= getS().ayahs.length;
    i++
  ){

    state.ayah = i;

    selectSurah();
    render();

    await new Promise(res => {

      const a = getA();
      const x = new Audio(audioUrl(a));

      state.audio = x;

      x.playbackRate = state.speed;

      x.onended = res;

      x.play().catch(res);

    });
  }
}

}

function renderBuild(){

const a=getA();

const words=
a.a.replace(/[﴿﴾]/g,'')
.split(/\s+/)
.filter(Boolean);

let shuffled=
[...words].sort(()=>Math.random()-.5);

app.innerHTML=`

<div class="game build">

<b>Build Ayah ${a.n}</b>

<p class="small">
Tap the words in the correct order.
</p>

<div id="chosen" class="wordbox"></div>

<div id="pool"
class="wordbox"
style="margin-top:10px">

${shuffled.map((w,i)=>
`<span class="word" data-i="${i}">
${w}
</span>`
).join('')}

</div>

<div class="controls">

<button id="check">
Check
</button>

<button class="alt" id="new">
Shuffle
</button>

<button class="alt" id="listen2">
▶ Listen
</button>

</div>

<div id="fb" class="feedback"></div>

</div>
`;

let chosen=[];

document.querySelectorAll('#pool .word')
.forEach((el,i)=>

el.onclick=()=>{

if(el.dataset.used)return;

el.dataset.used='1';

chosen.push(el.textContent.trim());

el.style.opacity=.3;

document.querySelector('#chosen')
.insertAdjacentHTML(
'beforeend',
`<span class="word">${el.textContent}</span>`
);

});

$('check').onclick=()=>{

const correct=chosen.join(' ')===words.join(' ');

$('fb').textContent=
correct
?'✓ Correct! MashaAllah!'
:'Try again — use the Arabic ayah above as your guide.';

};

$('new').onclick=renderBuild;

$('listen2').onclick=()=>play(a);

}

function renderReview(){

const items=
Object.entries(state.review)
.sort((a,b)=>b[1]-a[1])
.slice(0,30);

app.innerHTML=`

<div class="panel">

<h2>🧠 Smart Review</h2>

<p class="small">
Your practice history is stored only in this browser.
</p>

${
items.length
?
items.map(([k,v])=>{

let [s,a]=k.split(':').map(Number);

let x=state.data.surahs[s-1];

return `

<div class="review-item">

<span>
${x.name} • Ayah ${a}
</span>

<button class="alt" data-go="${k}">
${v} practice${v==1?'':'s'}
</button>

</div>

`;

}).join('')
:
'<p>No review history yet. Practice a few ayahs first.</p>'
}

</div>
`;

document.querySelectorAll('[data-go]')
.forEach(b=>

b.onclick=()=>{

let [s,a]=b.dataset.go
.split(':')  
.map(Number);

state.surah=s;
state.ayah=a;
state.mode='follow';

document.querySelectorAll('.tab')
.forEach(x=>
x.classList.toggle(
'active',
x.dataset.mode==='follow'
)
);

$('surah').value=s;

selectSurah();

$('ayah').value=a;

render();

});

}

init().catch(e=>

app.innerHTML=`

<div class="panel">

<b>Could not load Quran data.</b>

<p>
Make sure index.html and data.json are in the same GitHub Pages folder.
</p>

</div>

`);

</script>

</body>
</html>

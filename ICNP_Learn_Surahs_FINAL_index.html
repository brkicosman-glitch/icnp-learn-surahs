<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b4d">
<title>ICNP • Learn the Surahs by Heart</title>
<style>
:root{--g:#176b4d;--g2:#0e4b36;--gold:#c8a43a;--bg:#f5f7f4;--card:#fff;--ink:#17352a;--muted:#68756f;--line:#dfe7e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,var(--g2),var(--g));color:#fff;padding:24px 16px;text-align:center}
.brand{font-weight:800}.sub{opacity:.88}.title{font-size:1.8rem;margin:8px 0}
main{width:min(1050px,96vw);margin:16px auto 30px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #0000000b}
.panel{padding:14px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select,button{font:inherit}select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);min-width:250px}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:#eaf0ec;color:var(--g2)}button.gold{background:var(--gold);color:#1e3027}
.specials{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.specials button{flex:1 1 190px}
.tabs{display:flex;gap:8px;margin-top:12px}.tab.active{background:var(--gold);color:#1e3027}
.card{margin-top:12px;padding:18px}.arabic{font-family:"Amiri Quran","Amiri",serif;font-size:2rem;line-height:2.2;text-align:right;direction:rtl;margin:14px 0}
.translit{color:#52635b;font-style:italic;line-height:1.6}.translation{margin-top:10px;line-height:1.6}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.progress{height:8px;background:#e8ede9;border-radius:9px;overflow:hidden;margin-top:13px}.bar{height:100%;background:var(--g)}
.wordbox{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:10px;border:2px dashed #ccd7cf;border-radius:12px;direction:rtl}
.word{background:#eef4f0;color:var(--g2);border:1px solid #d9e4dc;padding:9px 11px;border-radius:10px;cursor:pointer}
.small{font-size:.84rem;color:var(--muted)}.error{color:#8a1f1f;background:#fff1f1;border:1px solid #efcaca;padding:12px;border-radius:12px}
.special-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#edf2ee;color:var(--g);padding:6px 9px;border-radius:999px;font-weight:700;font-size:.82rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 25px}
@media(max-width:600px){.arabic{font-size:1.65rem}select{min-width:100%}.title{font-size:1.45rem}}
</style>
</head>
<body>
<header>
  <div class="brand">Islamic Center of North Phoenix</div>
  <div class="title">🌟 Learn the Surahs by Heart</div>
  <div class="sub">Quran memorization practice • ICNP Mekteb</div>
</header>

<main>
<section class="panel">
  <div class="row">
    <select id="surah"></select>
    <select id="ayah"></select>
    <button id="start">Start / Restart</button>
  </div>

  <div class="specials">
    <button class="gold" data-special="kursi">Ajetul-Kursijj</button>
    <button class="gold" data-special="alim">Elif-Lam-Mim</button>
    <button class="gold" data-special="kunut">Kunut-dova</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="follow">Follow</button>
    <button class="tab" data-mode="build">Build the Ayah</button>
    <button class="tab" data-mode="review">Smart Review</button>
  </div>
</section>

<section id="app"></section>
</main>

<footer>Islamic Center of North Phoenix • Your progress is saved on this device.</footer>

<script>
const ALLOWED_IDS=[1,93,94,95,96,97,98,99,100,101,102,103,104,105,106,107,108,109,110,111,112,113,114];

const state={
  data:null,surah:1,ayah:1,mode:"follow",speed:1,repeat:0,audio:null,
  review:JSON.parse(localStorage.getItem("icnp-review")||"{}")
};

const $=id=>document.getElementById(id);
const app=$("app");

function esc(x){
  return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function init(){
  try{
    const r=await fetch("https://brkicosman-glitch.github.io/icnp-learn-surahs/data.json?v=20260928",{cache:"no-store"});
    if(!r.ok) throw new Error("data.json nije pronađen ("+r.status+")");
    state.data=await r.json();
    if(!state.data || !Array.isArray(state.data.surahs)) throw new Error("data.json nema očekivani format.");
    fillSurahs();
    selectSurah();
    render();
  }catch(e){
    app.innerHTML='<div class="card error"><b>Stranica nije uspjela učitati Kur’an.</b><br><br>'+esc(e.message)+'<br><br><span class="small">Provjeri da su index.html i data.json u istom folderu GitHub Pages stranice.</span></div>';
  }
}

function allowedSurahs(){
  return state.data.surahs.filter(s=>ALLOWED_IDS.includes(Number(s.id)));
}

function fillSurahs(){
  $("surah").innerHTML=allowedSurahs().map(s=>
    `<option value="${s.id}">${s.id}. ${esc(s.name)} — ${esc(s.arabicName)}</option>`
  ).join("");
  $("surah").value=state.surah;
}

function getS(){return state.data.surahs.find(s=>Number(s.id)===Number(state.surah))}
function getA(){const s=getS();return s?.ayahs?.find(a=>Number(a.n)===Number(state.ayah))}
function selectSurah(){
  const s=getS();
  if(!s)return;
  $("ayah").innerHTML=(s.ayahs||[]).map(a=>`<option value="${a.n}">Ayah ${a.n}</option>`).join("");
  $("ayah").value=state.ayah;
}

function setSurah(id){
  state.surah=Number(id);state.ayah=1;selectSurah();render();
}

$("surah").onchange=e=>setSurah(e.target.value);
$("ayah").onchange=e=>{state.ayah=Number(e.target.value);render()};
$("start").onclick=()=>{state.ayah=1;selectSurah();render()};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");state.mode=b.dataset.mode;render();
});

function audioUrl(a){return `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${a.g}.mp3`}
function play(a){
  if(!a||!a.g)return;
  if(state.audio){state.audio.pause();state.audio=null}
  const x=new Audio(audioUrl(a));state.audio=x;x.playbackRate=state.speed;
  x.play().catch(()=>alert("Pritisni Listen ponovo da dozvoliš audio."));
  x.onended=()=>{if(state.repeat>0){state.repeat--;play(a)}};
}
function mark(){
  const k=`${state.surah}:${state.ayah}`;
  state.review[k]=(state.review[k]||0)+1;
  localStorage.setItem("icnp-review",JSON.stringify(state.review));
}

function render(){
  if(state.mode==="follow")renderFollow();
  else if(state.mode==="build")renderBuild();
  else renderReview();
}

function renderFollow(){
  const s=getS(),a=getA();
  if(!s||!a){app.innerHTML='<div class="card error">Nije pronađen odabrani ajet.</div>';return}
  mark();
  app.innerHTML=`<div class="card">
    <div class="row"><span class="badge">${a.n}/${s.ayahs.length}</span><b>${esc(s.name)} • ${esc(s.arabicName)}</b></div>
    <div class="arabic">${esc(a.a)}</div>
    <div class="translit">${esc(a.t)}</div>
    <div class="translation">${esc(a.e)}</div>
    <div class="controls">
      <button id="listen">▶ Listen</button>
      <button class="alt" id="repeat">🔁 Repeat 3×</button>
      <button class="alt" id="prev">← Previous</button>
      <button class="alt" id="next">Next →</button>
    </div>
    <div class="controls">
      <button class="alt" data-speed="1">Normal</button>
      <button class="alt" data-speed=".75">Slower</button>
      <button class="alt" data-speed=".5">Slowest</button>
    </div>
    <div class="progress"><div class="bar" style="width:${Math.round(Number(a.n)/s.ayahs.length*100)}%"></div></div>
  </div>`;
  $("listen").onclick=()=>{state.repeat=0;play(a)};
  $("repeat").onclick=()=>{state.repeat=2;play(a)};
  $("prev").onclick=()=>{if(state.ayah>1){state.ayah--;selectSurah();render()}};
  $("next").onclick=()=>{if(state.ayah<s.ayahs.length){state.ayah++;selectSurah();render()}};
  document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{
    state.speed=Number(b.dataset.speed);if(state.audio)state.audio.playbackRate=state.speed;
  });
}

function renderBuild(){
  const a=getA();if(!a)return;
  const words=String(a.a).replace(/[﴿﴾]/g,"").split(/\s+/).filter(Boolean);
  let shuffled=[...words].sort(()=>Math.random()-.5);
  app.innerHTML=`<div class="card">
    <b>Build Ayah ${a.n}</b>
    <p class="small">Složi riječi ajeta pravilnim redoslijedom.</p>
    <div id="chosen" class="wordbox"></div>
    <div id="pool" class="wordbox" style="margin-top:10px">${shuffled.map((w,i)=>`<span class="word" data-i="${i}">${esc(w)}</span>`).join("")}</div>
    <div class="controls"><button id="check">Check</button><button class="alt" id="new">Shuffle</button><button class="alt" id="listen2">▶ Listen</button></div>
    <div id="fb" class="small"></div>
  </div>`;
  let chosen=[];
  document.querySelectorAll("#pool .word").forEach(el=>el.onclick=()=>{
    if(el.dataset.used)return;
    el.dataset.used="1";chosen.push(el.textContent);el.style.opacity=".35";
    $("chosen").insertAdjacentHTML("beforeend",`<span class="word">${esc(el.textContent)}</span>`);
  });
  $("check").onclick=()=>{
    $("fb").textContent=chosen.join(" ")===words.join(" ")?"✓ Tačno!":"Pokušaj ponovo.";
  };
  $("new").onclick=renderBuild;$("listen2").onclick=()=>play(a);
}

function renderReview(){
  const items=Object.entries(state.review).sort((a,b)=>b[1]-a[1]).slice(0,30);
  app.innerHTML=`<div class="card"><h2>🧠 Smart Review</h2>
  <p class="small">Historija učenja se čuva samo na ovom uređaju.</p>
  ${items.length?items.map(([k,v])=>{
    const [s,a]=k.split(":").map(Number),x=state.data.surahs.find(q=>Number(q.id)===s);
    return x?`<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">
      <span>${esc(x.name)} • Ayah ${a}</span><button class="alt" data-go="${k}">${v} practice${v==1?"":"s"}</button></div>`:"";
  }).join(""):"<p>Još nema historije. Vježbaj nekoliko ajeta.</p>"}</div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const [s,a]=b.dataset.go.split(":").map(Number);
    state.surah=s;state.ayah=a;state.mode="follow";
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.mode==="follow"));
    $("surah").value=s;selectSurah();$("ayah").value=a;render();
  });
}

async function special(type){
  if(!state.data)return;
  if(type==="kursi"){
    const s=state.data.surahs.find(x=>Number(x.id)===2),a=s?.ayahs?.find(x=>Number(x.n)===255);
    showSpecial("Ajetul-Kursijj","El-Bekare, 255",a);
  }else if(type==="alim"){
    const s=state.data.surahs.find(x=>Number(x.id)===2),a=s?.ayahs?.find(x=>Number(x.n)===1);
    showSpecial("Elif-Lam-Mim","El-Bekare, 1",a);
  }else{
    showKunut();
  }
}

function showSpecial(title,ref,a){
  app.innerHTML=`<div class="card"><div class="special-title"><h2>${title}</h2><span class="badge">${ref}</span></div>
    ${a?`<div class="arabic">${esc(a.a)}</div><div class="translit">${esc(a.t)}</div><div class="translation">${esc(a.e)}</div>`:"<div class='error'>Ajet nije pronađen u data.json.</div>"}
    <div class="controls">${a?'<button id="spListen">▶ Listen</button>':""}<button class="alt" id="back">← Nazad na sure</button></div>
  </div>`;
  if(a)$("spListen").onclick=()=>play(a);
  $("back").onclick=()=>{state.mode="follow";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.mode==="follow"));render()};
}

function showKunut(){
  app.innerHTML=`<div class="card">
    <div class="special-title"><h2>Kunut-dova</h2><span class="badge">Posebna dova</span></div>
    <div class="arabic">اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ كُلَّهُ نَشْكُرُكَ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ. اللَّهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ وَإِلَيْكَ نَسْعَى وَنَحْفِدُ وَنَرْجُو رَحْمَتَكَ وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ.</div>
    <div class="translit">Allahumme inna neste'inuke ve nestagfiruke ve nu'minu bike ve netevekkelu alejke ve nusni alejkel-hajre kullehu, neškuruke ve la nekfuruke ve nahle'u ve netruku men jefduruke. Allahumme ijjake na'budu ve leke nusalli ve nescudu ve ilejke nes'a ve nahfidu, ve nerdu rahmeteke ve nahša azabeke, inne azabeke bil-kuffari mulhik.</div>
    <div class="translation">Allahu, od Tebe pomoć tražimo, od Tebe oprost molimo, u Tebe vjerujemo i na Tebe se oslanjamo. Tebe hvalimo svakim dobrom, zahvaljujemo Ti i ne poričemo Te. Odričemo se i napuštamo onoga ko Ti je neposlušan. Allahu, samo Tebi robujemo, Tebi klanjamo i sedždu činimo; prema Tebi težimo i žurimo. Tvojoj milosti se nadamo i Tvoje kazne se bojimo. Zaista će Tvoja kazna stići nevjernike.</div>
    <div class="controls"><button class="alt" id="backK">← Nazad na sure</button></div>
  </div>`;
  $("backK").onclick=()=>{state.mode="follow";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.mode==="follow"));render()};
}

document.querySelectorAll("[data-special]").forEach(b=>b.onclick=()=>special(b.dataset.special));

init();
</script>
</body>
</html>
